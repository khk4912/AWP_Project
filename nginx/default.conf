map $http_x_forwarded_host $proxy_forwarded_host {
  default $http_x_forwarded_host;
  "" $http_host;
}

map $http_x_forwarded_proto $proxy_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name g.kosame.dev;

  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://backend:3000/;

    proxy_http_version 1.1;
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }

  location / {
    proxy_pass http://frontend:3001/;

    proxy_http_version 1.1;
    proxy_set_header Host $proxy_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $proxy_forwarded_host;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }
}
